# cPanel / Apache: pass the subdomain's traffic to the app on 127.0.0.1:3000.
# Copy into BOTH (replace CPANELUSER with the cPanel account that owns raresquaredlabs.co.uk):
#   /etc/apache2/conf.d/userdata/ssl/2_4/CPANELUSER/enquiries.raresquaredlabs.co.uk/proxy.conf
#   /etc/apache2/conf.d/userdata/std/2_4/CPANELUSER/enquiries.raresquaredlabs.co.uk/proxy.conf
# then run: /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On
    # Let cPanel's AutoSSL keep renewing the certificate
    ProxyPass /.well-known/ !
    ProxyPass / http://127.0.0.1:3000/ timeout=180
    ProxyPassReverse / http://127.0.0.1:3000/
    <IfModule mod_headers.c>
        RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    </IfModule>
</IfModule>
