# nginx: serves https://enquiries.raresquaredlabs.co.uk and passes requests to the app.
# Install: sudo cp deploy/nginx-enquiries.conf /etc/nginx/sites-available/enquiries
#          sudo ln -s /etc/nginx/sites-available/enquiries /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d enquiries.raresquaredlabs.co.uk   (adds HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name enquiries.raresquaredlabs.co.uk;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Website reading and AI drafting can take a while
        proxy_read_timeout 180s;
    }
}
